version: 1
base: auto

execution:
  concurrency: 2
  reviewerTimeoutMs: 600000

validation: []

reviewers:
  correctness:
    profile: correctness
    thinking: high
    tools: [read, grep, find, ls, bash]

  testing:
    profile: testing
    thinking: medium
    tools: [read, grep, find, ls, bash]

  spec:
    profile: spec
    thinking: high
    tools: [read, grep, find, ls, bash]
    when:
      paths: ["specs/**"]
