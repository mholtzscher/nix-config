id = "herdr-worktree-picker"
name = "Herdr Worktree Picker"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Create worktrees from local or remote branches"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Pick worktree base"
contexts = ["workspace"]
command = ["./bin/herdr-worktree-picker", "open"]

[[panes]]
id = "picker"
title = "Pick worktree base"
placement = "popup"
width = "80%"
height = "80%"
command = ["./bin/herdr-worktree-picker", "picker"]
